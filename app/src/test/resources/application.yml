security:
  jwt:
    secret: "test-secret-key-for-jwt-signing-must-be-at-least-32-bytes-long"
    issuer: projet-api-test
    access-token-ttl-minutes: 15
    refresh-token-ttl-days: 7
app:
  frontend-url: http://localhost:4200
  cors:
    allowed-origins: http://localhost:4200
  cookie:
    secure: false
    same-site: Lax
spring:
  jpa:
    # Comme en production : si une entité ne correspond pas à la base, le démarrage échoue.
    hibernate:
      ddl-auto: validate
    open-in-view: false
