server:
  port: ${PORT:8080}

spring:
  application:
    name: projet
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}

security:
  jwt:
    secret: ${JWT_SECRET}
    issuer: projet-api
    access-token-ttl-minutes: 15
    refresh-token-ttl-days: 7
  otp:
    ttl-minutes: ${OTP_TTL_MINUTES:10}

app:
  mail:
    provider: ${MAIL_PROVIDER:log}
    from: ${MAIL_FROM:}
    brevo:
      api-key: ${BREVO_API_KEY:}
      sender-email: ${BREVO_SENDER_EMAIL:}
      sender-name: ${BREVO_SENDER_NAME:Dr Aissatou Fall}
  storage:
    provider: ${STORAGE_PROVIDER:local}
    local:
      base-dir: ${STORAGE_LOCAL_BASE_DIR:uploads}
    cloudinary:
      cloud-name: ${CLOUDINARY_CLOUD_NAME}
      api-key: ${CLOUDINARY_API_KEY}
      api-secret: ${CLOUDINARY_API_SECRET}

spring.mail:
  host: ${MAIL_HOST:}
  port: ${MAIL_PORT:587}
  username: ${MAIL_USERNAME:}
  password: ${MAIL_PASSWORD:}
  properties:
    mail:
      smtp:
        auth: true
        starttls:
          enable: true

management:
  health:
    mail:
      enabled: false
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,info
