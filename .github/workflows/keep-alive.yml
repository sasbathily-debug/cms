name: Keep backend awake

# Render free tier spins the service down after ~15 minutes of inactivity, and
# the next request then pays a slow cold start (Postgres + Redis + JVM boot).
# Pinging the health endpoint every 10 minutes keeps it warm around the clock.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          curl -sS --max-time 200 -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" \
            "${{ vars.BACKEND_HEALTH_URL || 'https://cms-ikg2.onrender.com/actuator/health' }}"
